name: Retreinar modelo

on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda, 06:00 de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar manchetes novas
        run: python scripts/collect.py
      - name: Treinar e exportar o modelo
        run: python scripts/train.py
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/headlines.csv model.json metrics.json
          git diff --cached --quiet || (git commit -m "🤖 Modelo retreinado ($(date -u +%d/%m/%Y))" && git push)
